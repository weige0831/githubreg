name: Test

# 只做这件事：构建/测试这个仓库的代码。
# 不跑任何与项目无关的自动化（那是 GitHub Actions 用途限制里的红线，也会连累仓库被处理）。
#
# 凭证一律走仓库 Secrets（Settings → Secrets and variables → Actions），不要用 workflow 输入传：
# 输入会明文出现在运行日志里（公开仓库 = 人人可见），Secrets 会被自动打码成 ***。
#   MAIL_API_URL / MAIL_DOMAIN                     邮局地址与域名
#   MANAGER_BASE_URL / MANAGER_PASSWORD            管理器地址与密码（或只配 MANAGER_API_KEY）
#   MANAGER_API_KEY                                可选：管理器的 API Key（配了就用它鉴权）

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # 只有无害的测试参数能从这里传；地址/密码一律走 Secrets
      batch_count:
        description: "连续注册数量（测试用：验证队列初始化与上限夹取，1~999）"
        required: false
        default: "20"
      manager_group_size:
        description: "每组数量（测试用：验证分组滚动，每 N 个一组）"
        required: false
        default: "10"
      run_real_flow:
        description: "跑真实注册流程测试（会真的注册一个账号，约 3~8 分钟；被反爬拦住算环境问题）"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  test:
    name: 测试（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 版本信息
        run: node --version

      - name: 静态检查（manifest / 引用完整性 / 不留私人默认值）
        run: node test-static.mjs

      - name: 逻辑测试（管理器导入、Clash 换节点、停止与重试、限流/拦截分流）
        env:
          BATCH_COUNT: ${{ inputs.batch_count || '20' }}
          MANAGER_GROUP_SIZE: ${{ inputs.manager_group_size || '10' }}
        run: node test-manager-import.mjs

      - name: 连通检查（邮局 + 管理器，用扩展自己的代码）
        env:
          MAIL_API_URL: ${{ secrets.MAIL_API_URL }}
          MAIL_DOMAIN: ${{ secrets.MAIL_DOMAIN }}
          MANAGER_BASE_URL: ${{ secrets.MANAGER_BASE_URL }}
          MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
          MANAGER_API_KEY: ${{ secrets.MANAGER_API_KEY }}
          MANAGER_GROUP_SIZE: ${{ inputs.manager_group_size || '10' }}
        run: node test-integration.mjs

  extension-load:
    name: 扩展装载测试（真实 Chrome）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 钉在 23.x：新版 puppeteer 会把 --load-extension 转成 CDP 调用，而那个接口老版 Chrome 没有
      - name: 装 puppeteer-core（用现成的 Chrome，不下载浏览器）
        run: npm install --no-save --no-package-lock puppeteer-core@23.11.1

      # Chrome 137+ 移除了命令行装载未打包扩展，所以单独下一个仍支持的 Chrome for Testing 136
      - name: 准备 Chrome 136（支持命令行装载未打包扩展）
        shell: pwsh
        run: |
          npx --yes @puppeteer/browsers install chrome@136 --path "$env:USERPROFILE\cft" | Out-Null
          $chrome = Get-ChildItem -Path "$env:USERPROFILE\cft" -Recurse -Filter chrome.exe | Select-Object -First 1
          if (-not $chrome) { throw "没找到 chrome.exe" }
          "CHROME_BIN=$($chrome.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $chrome.FullName --version

      - name: 装扩展并验证（能加载、后台能起来、面板能渲染）
        run: node test-extension-loads.mjs

  real-flow:
    name: 实际流程测试（真实注册一个号）
    runs-on: windows-latest
    timeout-minutes: 30
    # 等前两个 job 跑完再跑：一是别和它们抢 runner 资源（会影响 Chrome 启动），
    # 二是前面都过了才有必要真跑一遍注册
    needs: [test, extension-load]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_real_flow }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 装 puppeteer-core
        run: npm install --no-save --no-package-lock puppeteer-core@23.11.1

      - name: 准备 Chrome 136
        shell: pwsh
        run: |
          npx --yes @puppeteer/browsers install chrome@136 --path "$env:USERPROFILE\cft" | Out-Null
          $chrome = Get-ChildItem -Path "$env:USERPROFILE\cft" -Recurse -Filter chrome.exe | Select-Object -First 1
          if (-not $chrome) { throw "没找到 chrome.exe" }
          "CHROME_BIN=$($chrome.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & $chrome.FullName --version

      - name: 跑真实注册流程（注册 → 验证码 → 登录 → 建 token → 导入管理器）
        env:
          MAIL_API_URL: ${{ secrets.MAIL_API_URL }}
          MAIL_DOMAIN: ${{ secrets.MAIL_DOMAIN }}
          MANAGER_BASE_URL: ${{ secrets.MANAGER_BASE_URL }}
          MANAGER_PASSWORD: ${{ secrets.MANAGER_PASSWORD }}
          MANAGER_API_KEY: ${{ secrets.MANAGER_API_KEY }}
          REAL_FLOW_MINUTES: ${{ inputs.real_flow_minutes || '15' }}
        run: node test-real-flow.mjs

      # 出问题时（IP 被 GitHub 拦）要看现场：GitHub 那边到底是什么页面、扩展当时怎么判断的
      - name: 上传截图与面板日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-flow-artifacts
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
